<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passagem de ônibus</title>
</head>

<body>
    <h1>Passagem de ônibus</h1>
    <form action="processar_passagem.php" method="POST">
        <label for="origem"> Origem:Paraíba </label>
        <input type="text" id="origem" name="origem" required><br><br>

        <label for="destino">Destino:</label>
        <select id="destino" name="destino" required>
            <option value="">Selecione o destino</option>
            <option value="João Pessoa">João Pessoa</option>
            <option value="Campina Grande">Campina Grande</option>
            <option value="Patos">Patos</option>
            <option value="Sousa">Sousa</option>
            <option value="Cajazeiras">Cajazeiras</option>
            <option value="Guarabira">Guarabira</option>
            <option value="Santa Rita">Santa Rita</option>
        </select><br><br>
        <label for="horario">Horário: 6:00, 7:00, 8:00, 9:00, 10:00, 11:00, 12:00, 13:00, 14:00, 15:00, 16:00, 17:00,
            18:00, 19:00, 20:00</label>

        <label for="data">Data da viagem: 2 de janeiro até dia 30 de dezembro</label>
        <input type="date" id="data" name="data" required><br><br>

        <label for="passageiros">Número de passageiros: 39 sentados, 39 em pé</label>
        <input type="number" id="passageiros" name="passageiros" min="1" required><br><br>

        <input type="submit" value="Comprar Passagem">
        <label for="preco">Preço da passagem:R$ 5,00</label>
    </form>
</body>

</html>
